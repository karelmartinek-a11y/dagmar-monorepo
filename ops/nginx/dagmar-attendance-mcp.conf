location ~ ^/(mcp|attendance-oauth/(authorize|token|register|revoke)|[.]well-known/(oauth-protected-resource/mcp|oauth-authorization-server/attendance-oauth))$ {
    include /etc/nginx/snippets/dagmar-security-headers.conf;
    access_log off;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8101;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "no-store" always;
}
