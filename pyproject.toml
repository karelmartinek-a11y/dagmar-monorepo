[project]
name = "kajovodagmar"
version = "1.0.0"
description = "KájovoDagmar docházkový systém pro doménu dagmar.hcasc.cz"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "HCASC" }]

dependencies = [
  "fastapi>=0.110.0,<1.0.0",
  "uvicorn[standard]>=0.27.0,<1.0.0",
  "gunicorn>=21.2.0,<23.0.0",

  # 2.0.52 was published without CPython 3.12 Linux wheels; production is wheel-only.
  "SQLAlchemy>=2.0.25,<2.0.52",
  # SQLAlchemy's Linux-only marker must remain present in locks generated on macOS.
  "greenlet>=3.2.4,<4.0.0",
  "alembic>=1.13.1,<2.0.0",
  "psycopg[binary]>=3.1.17,<4.0.0",

  "pydantic>=2.6.0,<3.0.0",
  "pydantic-settings>=2.2.0,<3.0.0",

  "python-multipart>=0.0.9,<1.0.0",

  # password hashing
  "argon2-cffi>=23.1.0,<24.0.0",
  "bcrypt>=4.1.2,<5.0.0",

  # signed cookies / sessions
  "itsdangerous>=2.1.2,<3.0.0",

  # rate limiting
  "slowapi>=0.1.9,<1.0.0",

  # misc
  "python-dateutil>=2.9.0.post0,<3.0.0",
  "httpx>=0.26.0,<1.0.0",
  "cryptography>=50.0.0,<51.0.0",
  "cffi>=2.0.0,<2.1.0",
  "PyJWT[crypto]>=2.10.1,<3.0.0",
  "Pillow>=12.3.0,<13.0.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.4.0,<1.0.0",
  "mypy>=1.8.0,<2.0.0",
  "pytest>=9.0.3,<10.0.0",
  "httpx2>=2.0.0,<3.0.0",
  "bandit==1.9.4",
  "build==1.5.0",
  "hatchling==1.32.0",
  "pip-audit==2.10.1",
  "pip-tools==7.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["slowapi", "slowapi.*", "httpx", "httpx.*", "jwt", "jwt.*"]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"
