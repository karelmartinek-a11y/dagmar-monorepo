resolved_findings:
  - "P1 skupinového sticky sloupce vyřešen: TH/TD zachovávají tabulkovou geometrii a mají vnitřní grid wrappery, dlouhá identita se zalamuje uvnitř vlastní buňky a neprůhledné sticky pozadí zakrývá odscrollovaný obsah. Ověřeno při horizontálním scrollu na17.den ve všech šířkách a jazycích včetně pending stavu."
  - "Časový race plánu vyřešen potvrzeným kanonickým read-backem a readonly obou polí stejného dne do dokončení. ClockInput zachovává novou kanonickou hodnotu i případný fokus a draft jiného dne při opožděném potvrzení."
  - "P1 nativního PDF vyřešen: identita a součty se měřeně zalamují uvnitř buněk, neutrální časy jsou svisle v jednom denním sloupci, společná hlavička a legenda nepřetékají. Samostatný plánový součet je viditelný i pro hidden-total a TASK. Ověřeno skutečným API s Pillow 13: pillow13-fixed-native-api-page1.png a pillow13-fixed-five-employments-page1.png."
  - "Absolutní sr-only stav ClockInput unikal zaměstnaneckým scroll wrapperům. position:relative na obou wrapperech zachovává scroll tabulky a odstranilo page overflow; ověřeno všemi šířkami a jazyky."
limitations:
  - "P2 mimo tento rozsah: nezměněný samostatný tisk plánu s extrémně dlouhým jménem/názvem a pěti metrikami může pokračovat na další A4 stránce. Data zůstávají dostupná; tento záznam nepotvrzuje jedno-stránkový fit takového tisku."
notes: "SCHVÁLENO po finální interakční a vizuální revalidaci. Skutečný lokální PostgreSQL/FastAPI/Vite runtime ověřil72hlavních a21doplňkových kontrol,42pending viewport/jazyk variant, delayed read-back ve všech třech plánových plochách, standardní focusnext i zachování fokusu a draftu jiného dne při opožděném potvrzení. Souběžné zápisy různých dnů zachovaly oba zámky do kanonického načtení. Finální horizontálně posunuté rendery skupinového plánu po opravě table-cell geometrie neobsahují překryv identity a inputů. Dřívější pětimístná31denní A4 evidence nativního PDF v inherited_pdf_directory zůstává platná, renderer se v této interakční změně nezměnil a nativní API PDF bylo znovu úspěšně vytvořeno. Žádný otevřený P0/P1 v rozsahu změny; produkce nebyla použita ani změněna."
