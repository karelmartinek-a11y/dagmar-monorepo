resolved_findings:
  - "P1 nativního PDF vyřešen: identita a součty se měřeně zalamují uvnitř buněk, neutrální časy jsou svisle v jednom denním sloupci, společná hlavička a legenda nepřetékají. Samostatný plánový součet je viditelný i pro hidden-total a TASK. Ověřeno skutečným API s Pillow 13: pillow13-fixed-native-api-page1.png a pillow13-fixed-five-employments-page1.png."
  - "Absolutní sr-only stav ClockInput unikal zaměstnaneckým scroll wrapperům. position:relative na obou wrapperech zachovává scroll tabulky a odstranilo page overflow; ověřeno všemi šířkami a jazyky."
limitations:
  - "P2 mimo tento rozsah: nezměněný samostatný tisk plánu s extrémně dlouhým jménem/názvem a pěti metrikami může pokračovat na další A4 stránce. Data zůstávají dostupná; tento záznam nepotvrzuje jedno-stránkový fit takového tisku."
notes: "SCHVÁLENO po revalidaci aktualizovaných dependencies a opravě nativního PDF rendereru. UI část prošla skutečnými lokálními rendery a reálným API: 72 hlavních kontrol a 21 doplňkových záznamů, orphan persistence employee/admin, postupné smazání celé směny, všechny šířky a relevantní jazyky bez neočekávaného interaktivního page overflow. Opravený nativní PDF export byl stažen přes skutečné API a zkontrolován po rasterizaci; pět úvazků s31dny se vejde na jednu A4 landscape bez původních překryvů a chybějících součtů. Žádný otevřený P0/P1 v rozsahu změny. Produkce nebyla použita ani změněna."
